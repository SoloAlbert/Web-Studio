<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mueblería San José · Clientes, créditos y apartados</title>
<link rel="icon" href="../../assets/icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../portafolio/portafolio.css">
<style>
:root{--fondo:#f4f5f8;--panel:#fff;--texto:#1b2033;--suave:#5b6178;--linea:#e3e5ec;--acento:#c97f66;--acento-o:#b36a52;--acento-c:#f7ebe6;--exito:#2e9d6a;--aviso:#d9822b;--peligro:#c94a4a;--oscuro:#1b2033;--sombra:0 1px 2px rgba(27,32,51,.04),0 8px 24px rgba(27,32,51,.06)}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fondo);color:var(--texto);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.2;letter-spacing:-.015em}
svg{flex:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;background:var(--oscuro);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:28px}
.neg{display:flex;gap:12px;align-items:center;padding:0 8px}
.neg-logo{width:42px;height:42px;border-radius:13px;background:var(--acento);display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none;color:#fff}
.neg strong{display:block;font-size:1rem;line-height:1.2}
.neg small{display:block;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:3px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:11px;background:none;border:0;color:rgba(255,255,255,.7);font-weight:500;cursor:pointer;text-align:left;font-size:.93rem}
.menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.menu button.activo{background:rgba(255,255,255,.12);color:#fff}
.menu button.activo svg{color:#e8b4a0}
.menu svg,.navmov svg{width:20px;height:20px}
.lateral-pie{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:.78rem;color:rgba(255,255,255,.55);display:flex;gap:10px;align-items:center}
.lateral-pie .avatar{width:34px;height:34px;font-size:.78rem}
.lateral-pie b{display:block;color:#fff;font-weight:600}
.superior,.navmov{display:none}
.principal{min-width:0;padding:28px 32px 120px}
.encabezado{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.encabezado h1{font-size:1.55rem;font-weight:700}
.encabezado p{margin-top:4px;color:var(--suave)}
.panel{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra)}
.panel-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--linea)}
.panel-cab h2{font-size:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--linea);background:#fff;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;color:var(--texto);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#c9ccd7}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.prim:hover{background:var(--acento-o);border-color:var(--acento-o)}
.btn.ok{background:var(--exito);border-color:var(--exito);color:#fff}
.btn.mal{color:var(--peligro);border-color:#efcdcd}
.btn.wa{background:#e6f5ee;border-color:#c7e8d7;color:#1d7a4e}
.btn.wa:hover{background:#d8f0e4}
.btn.chico{padding:7px 12px;font-size:.8rem;border-radius:10px}
.btn.icono{padding:9px;width:40px;height:40px}
.btn svg{width:17px;height:17px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.campo label{font-size:.78rem;font-weight:600;color:var(--suave)}
.campo input,.campo select,.campo textarea,.buscador input{border:1px solid var(--linea);border-radius:11px;padding:10px 12px;background:#fff;width:100%;outline:none;min-width:0;font-size:.92rem}
.campo input:focus,.campo select:focus,.buscador input:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(201,127,102,.16)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buscador{position:relative}
.buscador svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--suave)}
.buscador input{padding-left:38px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi span{font-size:.78rem;color:var(--suave);font-weight:500}
.kpi strong{display:block;font-size:1.45rem;margin-top:4px;letter-spacing:-.02em}
.kpi small{color:var(--suave);font-size:.76rem}
.etq{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.etq.ok{background:#e2f4eb;color:#1f7a50}.etq.av{background:#fcefdf;color:#a35a12}.etq.mal{background:#f9e3e3;color:#a63636}.etq.neu{background:#eef0f4;color:var(--suave)}.etq.ac{background:var(--acento-c);color:#9a553f}
.seg{display:inline-flex;background:#e9ebf1;border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:.84rem;color:var(--suave);cursor:pointer}
.seg button.activo{background:#fff;color:var(--texto);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--suave);white-space:nowrap}
.chip.activo{background:var(--texto);color:#fff;border-color:var(--texto)}
.tabla-cont{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--linea);white-space:nowrap;background:#fafbfc}
td{padding:12px 16px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vacio{padding:42px 20px;text-align:center;color:var(--suave)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:.85rem;letter-spacing:.02em}
.sub{color:var(--suave);font-size:.85rem}
.velo{position:fixed;inset:0;z-index:80;background:rgba(27,32,51,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:aparece .15s ease-out}
.hoja{background:#fff;border-radius:18px;width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:sube .2s ease-out}
.hoja.ancha{width:min(720px,100%)}
.hoja-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 4px}
.hoja-cab h2{font-size:1.2rem;margin-top:6px}
.hoja-cuerpo{padding:14px 22px 6px}
.hoja-pie{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:12px 22px 22px}
.cerrar{border:0;background:#f1f2f6;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--suave)}
.cerrar svg{width:18px;height:18px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;background:#f8f9fb;border-radius:14px;padding:14px 16px}
.datos span{display:block;font-size:.74rem;color:var(--suave);font-weight:500}
.datos strong{font-size:.92rem;font-weight:600}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:95;background:var(--texto);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:0 14px 34px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100% - 32px);animation:baja .2s ease-out}
.toast svg{width:18px;height:18px;color:#7fd8a9}
@keyframes aparece{from{opacity:0}}
@keyframes sube{from{transform:translateY(14px);opacity:0}}
@keyframes baja{from{transform:translate(-50%,-10px);opacity:0}}
@media (max-width:899px){
  .app{display:block}
  .lateral{display:none}
  .superior{display:flex;position:sticky;top:0;z-index:30;background:var(--oscuro);color:#fff;padding:10px 16px;align-items:center;gap:11px;min-height:58px}
  .superior .neg-logo{width:36px;height:36px;border-radius:11px;font-size:.88rem}
  .superior strong{display:block;font-size:.98rem;line-height:1.15}
  .superior small{display:block;font-size:.7rem;color:rgba(255,255,255,.55)}
  .principal{padding:18px 16px 190px}
  .navmov{display:flex;position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:0 10px 30px rgba(27,32,51,.16);padding:5px;gap:2px;max-width:560px;margin:0 auto}
  .navmov button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--suave);background:none;border:0;padding:7px 2px;border-radius:13px;cursor:pointer}
  .navmov button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .navmov button.activo{color:var(--acento-o);background:var(--acento-c)}
  body.directo .navmov{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body.directo .principal{padding-bottom:110px}
  .encabezado{margin-bottom:16px}
  .encabezado h1{font-size:1.3rem}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{padding:13px 14px}
  .kpi strong{font-size:1.18rem}
  .velo{align-items:flex-end;padding:0}
  .hoja,.hoja.ancha{width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .hoja-cab{padding:18px 18px 4px}.hoja-cuerpo{padding:12px 18px 6px}.hoja-pie{padding:12px 18px 20px}
  .hoja-pie .btn{flex:1}
}

/* ---------- Créditos ---------- */
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filtros .buscador{flex:1;min-width:220px;max-width:360px}
.cab-c,.fila-c{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.2fr) 130px;gap:14px;align-items:center;padding:12px 18px}
.cab-c{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;border-bottom:1px solid var(--linea);background:#fafbfc;border-radius:16px 16px 0 0}
.fila-c{width:100%;background:none;border:0;border-bottom:1px solid var(--linea);text-align:left;cursor:pointer}
.fila-c:last-child{border-bottom:0;border-radius:0 0 16px 16px}
.fila-c:hover{background:#fafbfc}
.fila-c small.lbl{display:none}
.c-nom{display:flex;gap:12px;align-items:center;min-width:0}
.c-nom b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-nom small{color:var(--suave);font-size:.78rem}
.c-nom > div:last-child{min-width:0}
.c-saldo b{font-size:1rem;font-variant-numeric:tabular-nums}
.c-lim span,.c-ult span{font-size:.86rem;font-variant-numeric:tabular-nums}
.c-ult small.f{display:block;color:var(--suave);font-size:.76rem}
.uso{height:6px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:5px;max-width:160px}
.uso i{display:block;height:100%;border-radius:99px;background:var(--acento)}
.c-est{text-align:right}
.volver{display:inline-flex;align-items:center;gap:6px;color:var(--suave);font-weight:600;font-size:.88rem;background:none;border:0;cursor:pointer;padding:0;margin-bottom:14px}
.volver svg{width:18px;height:18px}
.det-cab{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.det-cab .avatar{width:60px;height:60px;font-size:1.2rem}
.det-cab h1{font-size:1.5rem}
.det-cab .acciones{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.dos{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.credito{padding:16px 18px;border-bottom:1px solid var(--linea)}
.credito:last-child{border-bottom:0}
.credito-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.credito-top b{display:block}
.progreso{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.progreso i{display:block;height:100%;background:var(--exito);border-radius:99px}
.credito-dat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:.8rem}
.credito-dat span{display:block;color:var(--suave);font-size:.72rem}
.credito-dat b{font-variant-numeric:tabular-nums}
.abono{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--linea);font-size:.88rem}
.abono:last-child{border-bottom:0}
.abono small{display:block;color:var(--suave);font-size:.76rem}
.abono b{color:var(--exito);font-variant-numeric:tabular-nums;white-space:nowrap}
.cobro{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--linea)}
.cobro:last-child{border-bottom:0}
.dias-at{border-radius:12px;padding:8px 4px;text-align:center;font-weight:800;font-size:1.2rem;line-height:1}
.dias-at small{display:block;font-size:.64rem;font-weight:600;margin-top:3px}
.dias-at.av{background:#fcefdf;color:#a35a12}.dias-at.mal{background:#f9e3e3;color:#a63636}
.cobro-acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.apartados{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.apartado{padding:18px;display:flex;flex-direction:column;gap:12px}
.apartado h3{font-size:1rem}
.apartado .fila-ap{display:flex;justify-content:space-between;font-size:.86rem}
.apartado .fila-ap span{color:var(--suave)}
.apartado .fila-ap b{font-variant-numeric:tabular-nums}
.apartado .acc{display:flex;gap:8px;margin-top:auto}
.apartado .acc .btn{flex:1}
.venta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.venta .panel{padding:20px}
.venta h2{font-size:1.05rem;margin-bottom:14px}
.seg.ancho{display:flex}.seg.ancho button{flex:1}
.res-linea{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.res-linea span{color:var(--suave)}
.res-linea b{font-variant-numeric:tabular-nums}
.res-linea.total{border:0;font-size:1.05rem}
.res-linea.total b{color:var(--acento-o);font-size:1.3rem}
.tabla-pagos{max-height:340px;overflow:auto;border:1px solid var(--linea);border-radius:12px;margin-top:14px}
.tabla-pagos th{position:sticky;top:0}
.tabla-pagos td,.tabla-pagos th{padding:9px 12px;font-size:.84rem;white-space:nowrap}
.alerta-lim{border-radius:12px;padding:11px 14px;font-size:.85rem;margin-top:12px}
.alerta-lim.ok{background:#e2f4eb;color:#1f7a50}.alerta-lim.mal{background:#f9e3e3;color:#a63636}
.pct{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pct .chip{padding:5px 11px;font-size:.78rem}
@media (max-width:899px){
  .cab-c{display:none}
  .fila-c{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nom est" "saldo ult" "lim lim";gap:10px 12px;padding:14px 16px}
  .fila-c small.lbl{display:block;font-size:.7rem;color:var(--suave)}
  .c-nom{grid-area:nom}.c-est{grid-area:est}.c-saldo{grid-area:saldo}.c-ult{grid-area:ult;text-align:right}.c-lim{grid-area:lim}
  .uso{max-width:none}
  .det-cab .acciones{margin-left:0;width:100%}
  .det-cab .acciones .btn{flex:1}
  .det-cab h1{font-size:1.25rem}
  .dos,.venta{grid-template-columns:1fr}
  .credito-dat{grid-template-columns:1fr 1fr}
  .cobro{grid-template-columns:58px minmax(0,1fr);padding:14px 16px}
  .cobro-acc{grid-column:1/-1;justify-content:stretch}
  .cobro-acc .btn{flex:1}
  .apartados{grid-template-columns:1fr}
  .filtros .buscador{max-width:none;flex-basis:100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="neg"><div class="neg-logo" style="background:#8a5a3c">SJ</div><div><strong>Mueblería San José</strong><small>LocalConnect · Créditos y apartados</small></div></div>
    <nav class="menu" id="menu" aria-label="Pantallas"></nav>
    <div class="lateral-pie"><div class="avatar" style="background:#8a5a3c">AM</div><div><b>Antonio Morales</b>Gerente de crédito</div></div>
  </aside>
  <header class="superior">
    <div class="neg-logo" style="background:#8a5a3c">SJ</div>
    <div><strong>Mueblería San José</strong><small>LocalConnect · Créditos y apartados</small></div>
  </header>
  <main class="principal">
    <section class="pantalla" id="p-clientes" hidden></section>
    <section class="pantalla" id="p-detalle" hidden></section>
    <section class="pantalla" id="p-cobranza" hidden></section>
    <section class="pantalla" id="p-apartados" hidden></section>
    <section class="pantalla" id="p-venta" hidden></section>
  </main>
  <nav class="navmov" id="navmov" aria-label="Pantallas"></nav>
</div>

<script>
"use strict";
/* ================= Utilidades comunes ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dinero = (n) => "$" + Number(n).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  globo: svg('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>'),
  campana: svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  gente: svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'),
  tijeras: svg('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'),
  wa: svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>'),
  mas: svg('<path d="M12 5v14M5 12h14"/>'),
  izq: svg('<path d="m15 18-6-6 6-6"/>'),
  der: svg('<path d="m9 18 6-6-6-6"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  buscar: svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),

function registrarAbono(cliId, alTerminar) {
  const x = calcCliente(porId(cliId));
  const activos = x.cs.filter((y) => y.k.saldo > 0).sort((a, b) => b.k.atraso - a.k.atraso || a.c.inicio.localeCompare(b.c.inicio));
  if (!activos.length) return;
  const sugerido = (y) => Math.min(y.k.saldo, Math.max(y.k.vencido, y.c.pago));
  const h = modal(`${cabModal("Registrar abono", `<span class="etq neu">${esc(x.cli.nombre)}</span>`)}
    <form id="f-abono"><div class="hoja-cuerpo">
      <div class="campo"><label>Crédito</label><select name="credito">${activos.map((y) => `<option value="${y.c.id}">${esc(y.c.producto)} · saldo ${dinero(y.k.saldo)}</option>`).join("")}</select></div>
      <div class="fila2"><div class="campo"><label>Monto del abono</label><input name="monto" type="number" min="1" step="0.01" required inputmode="decimal"></div>
      <div class="campo"><label>Forma de pago</label><select name="forma"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div>
      <div class="datos" id="ab-info"></div>
    </div><div class="hoja-pie"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn prim">${ICON.check}Registrar abono</button></div></form>`);
  const f = $("#f-abono", h);
  const sel = () => activos.find((y) => y.c.id === +f.credito.value);
  const info = () => {
    const y = sel(), m = Math.min(+f.monto.value || 0, y.k.saldo);
    $("#ab-info", h).innerHTML = `<div><span>Saldo actual</span><strong>${dinero(y.k.saldo)}</strong></div><div><span>Saldo después del abono</span><strong style="color:var(--exito)">${dinero(y.k.saldo - m)}</strong></div><div><span>Pago ${y.c.frecuencia}</span><strong>${dinero(y.c.pago)}</strong></div><div><span>Vencido</span><strong style="color:${y.k.vencido ? "var(--peligro)" : "inherit"}">${dinero(y.k.vencido)}</strong></div>`;
  };
  f.monto.value = sugerido(sel());
  f.credito.addEventListener("change", () => { f.monto.value = sugerido(sel()); info(); });
  f.monto.addEventListener("input", info);
  info();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const y = sel(); let m = Math.round((+f.monto.value || 0) * 100) / 100;
    if (m <= 0) return f.monto.focus();
    m = Math.min(m, y.k.saldo);
    abonos.push({ id: sig++, credito: y.c.id, fecha: clave(HOY), monto: m, forma: f.forma.value });
    cerrarModal();
    if (alTerminar) alTerminar(); else RENDER[actual]();
    const nuevo = calcCliente(porId(cliId)).saldo;
    toast(`Abono de ${dinero(m)} registrado. Saldo: ${dinero(nuevo)}`);
  });
}

/* ================= Apartados ================= */
function calcAp(a) {
  const abonado = a.abonos.reduce((s, x) => s + x.monto, 0);
  const pagado = a.anticipo + abonado;
  const saldo = Math.max(0, a.precio - pagado);
  const dias = diasEntre(HOY, deClave(a.limite));
  return { abonado, pagado, saldo, dias };
}

      <div class="fila-ap"><span>Abonos (${a.abonos.length})</span><b>${dinero(k.abonado)}</b></div>
      <div class="fila-ap"><span>Saldo</span><b style="font-size:1.05rem;color:${k.saldo ? "var(--texto)" : "var(--exito)"}">${dinero(k.saldo)}</b></div>
      <div class="fila-ap"><span>Fecha límite</span><b>${fCorta(deClave(a.limite))}</b></div>

      <div class="panel kpi"><span>Dinero recibido</span><strong style="color:var(--exito)">${dinero(act.reduce((s, a) => s + calcAp(a).pagado, 0))}</strong><small>anticipos y abonos</small></div>
      <div class="panel kpi"><span>Vencen en 7 días</span><strong style="color:var(--aviso)">${act.filter((a) => calcAp(a).dias <= 7).length}</strong></div>

/* ================= Nueva venta a crédito ================= */
const V = { cli: "", prod: 0, precio: PRODUCTOS[0].p, pctEng: 15, enganche: null, frec: "semanal", pagos: 26 };
const OPC_PAGOS = { semanal: [13, 26, 39, 52], quincenal: [6, 12, 18, 24] };

  if (V.enganche === null) V.enganche = Math.round((V.precio * V.pctEng) / 100);
  const fin = Math.max(0, V.precio - V.enganche), pago = V.pagos ? redondea10(fin / V.pagos) : 0, per = V.frec === "semanal" ? 7 : 15;

      <div class="campo"><label>Producto</label><select name="prod">${PRODUCTOS.map((p, i) => `<option value="${i}" ${i === V.prod ? "selected" : ""}>${p.n}</option>`).join("")}</select></div>

  let id = +V.cli;
  if (V.cli === "nuevo") {
    const nombre = (V.nombre || "").trim(); if (!nombre) return $("#f-venta").nombre.focus();
    const c = { id: sig++, nombre, colonia: (V.colonia || "").trim() || "Sin colonia", limite: 15000, alta: clave(HOY) };
    clientes.push(c); id = c.id;
  }
  crearCredito(id, PRODUCTOS[V.prod].n + (V.precio !== PRODUCTOS[V.prod].p ? "" : ""), V.precio, V.enganche, V.frec, V.pagos, HOY);
  Object.assign(V, { cli: "", nombre: "", colonia: "", enganche: null, pctEng: 15 });
  verCliente(id);
  toast("Venta a crédito registrada");
});

document.addEventListener("DOMContentLoaded", () => {
  armarNav();
  const h = location.hash.slice(1);
  if (h.startsWith("cliente-") && porId(+h.slice(8))) verCliente(+h.slice(8)); else ir(h || "clientes");
});
