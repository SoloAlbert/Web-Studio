<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="pj">
  <!-- Pequeño Ninja (personaje original de LocalConnect). Piezas animables: pj-cinta, pj-pierna, pj-brazo -->
  <g class="pj-todo">
    <ellipse class="pj-sombra" cx="100" cy="240" rx="46" ry="7" fill="#000" opacity=".12"/>
    <!-- cintas de la banda -->
    <g class="pj-cinta">
      <path d="M146 44 C168 40 178 52 196 46 C186 58 170 56 150 54 Z" fill="#f26b1d"/>
      <path d="M146 50 C166 56 172 70 190 72 C176 80 160 70 148 58 Z" fill="#e0561a"/>
    </g>
    <!-- piernas -->
    <g class="pj-pierna pj-pierna--a">
      <rect x="77" y="168" width="20" height="50" rx="10" fill="#1f2a44"/>
      <ellipse cx="85" cy="221" rx="15" ry="9" fill="#151b2c"/>
    </g>
    <g class="pj-pierna pj-pierna--b">
      <rect x="103" y="168" width="20" height="50" rx="10" fill="#1f2a44"/>
      <ellipse cx="115" cy="221" rx="15" ry="9" fill="#151b2c"/>
    </g>
    <!-- brazo de atrás -->
    <g class="pj-brazo pj-brazo--b">
      <rect x="128" y="122" width="19" height="44" rx="9.5" fill="#e0561a"/>
      <circle cx="137.5" cy="166" r="10" fill="#ffd3b0"/>
    </g>
    <!-- cuerpo -->
    <rect x="66" y="116" width="68" height="64" rx="24" fill="#f26b1d"/>
    <path d="M84 118 L100 142 L116 118" fill="none" stroke="#1f2a44" stroke-width="7" stroke-linejoin="round"/>
    <rect x="66" y="152" width="68" height="10" fill="#1f2a44"/>
    <rect x="94" y="149" width="12" height="16" rx="3" fill="#ffc94a"/>
    <!-- brazo de adelante -->
    <g class="pj-brazo pj-brazo--a">
      <rect x="53" y="122" width="19" height="44" rx="9.5" fill="#f26b1d"/>
      <circle cx="62.5" cy="166" r="10" fill="#ffd3b0"/>
    </g>
    <!-- cabeza -->
    <g class="pj-cabeza">
      <circle cx="100" cy="72" r="54" fill="#1f2a44"/>
      <rect x="54" y="58" width="92" height="36" rx="18" fill="#ffd3b0"/>
      <ellipse cx="82" cy="76" rx="8" ry="10" fill="#151b2c"/>
      <ellipse cx="118" cy="76" rx="8" ry="10" fill="#151b2c"/>
      <circle cx="85" cy="72" r="3" fill="#fff"/>
      <circle cx="121" cy="72" r="3" fill="#fff"/>
      <ellipse cx="66" cy="88" rx="6" ry="3.5" fill="#ff9f9f" opacity=".7"/>
      <ellipse cx="134" cy="88" rx="6" ry="3.5" fill="#ff9f9f" opacity=".7"/>
      <path d="M74 62 Q82 57 90 61 M110 61 Q118 57 126 62" fill="none" stroke="#151b2c" stroke-width="3" stroke-linecap="round"/>
      <rect x="47" y="36" width="106" height="16" rx="8" fill="#f26b1d"/>
      <circle cx="148" cy="47" r="8" fill="#e0561a"/>
      <path d="M58 114 Q100 126 142 114 L140 104 Q100 112 60 104 Z" fill="#151b2c" opacity=".35"/>
